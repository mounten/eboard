name: Board builds

# Cross-compiles all examples for the board targets with the image in `docker/`
# (Ubuntu 20.04, glibc 2.31). Used by CI (artifacts) and by releases (attached to the release).

on:
  workflow_call:
    inputs:
      release-tag:
        description: Upload the binaries to this GitHub release instead of as workflow artifacts.
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raspberry Pi 4/5 (64-bit), NVIDIA Jetson, i.MX8
          - name: aarch64
            target: aarch64-unknown-linux-gnu
            features: ""
          # 32-bit ARM: i.MX6 (etnaviv KMS, Vivante fbdev or plain framebuffer), 32-bit Pi OS
          - name: armv7
            target: armv7-unknown-linux-gnueabihf
            features: ""
          # Intel/AMD boards and industrial PCs
          - name: x86_64
            target: x86_64-unknown-linux-gnu
            features: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }} --examples ${{ matrix.features }}

      - name: List examples
        run: |
          examples=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind[] == "example") | .name' | sort | xargs)
          echo "Examples: $examples"
          echo "EXAMPLES=$examples" >> "$GITHUB_ENV"

      - name: Check glibc version and linked libraries
        env:
          DIR: target/${{ matrix.target }}/release/examples
        run: |
          for example in $EXAMPLES; do
            bin="$DIR/$example"
            if [ ! -f "$bin" ]; then
              echo "::error::$example was not built"
              exit 1
            fi
            # Boards with older BSPs (JetPack 5, Pi OS Bullseye, Yocto) ship glibc 2.31.
            max=$(readelf -V "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$example: highest glibc symbol version $max"
            if [ "$(printf '%s\n' "$max" GLIBC_2.31 | sort -V | tail -1)" != GLIBC_2.31 ]; then
              echo "::error::$example needs $max, but boards may only have glibc 2.31"
              exit 1
            fi
            needed=$(readelf -d "$bin" | grep NEEDED)
            echo "$needed"
            # libgbm is loaded at runtime, so the same binary starts on boards without it.
            if echo "$needed" | grep -q libgbm; then
              echo "::error::$example must not link libgbm"
              exit 1
            fi
          done

      - name: Package
        # One archive per board, the examples in a directory of the same name.
        env:
          DIR: eboard-examples-${{ matrix.name }}
          SRC: target/${{ matrix.target }}/release/examples
        run: |
          mkdir "$DIR"
          for example in $EXAMPLES; do
            cp "$SRC/$example" "$DIR/"
          done
          tar -czf "$DIR.tar.gz" "$DIR"
          tar -tzvf "$DIR.tar.gz"

      - if: inputs.release-tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: eboard-examples-${{ matrix.name }}
          path: eboard-examples-${{ matrix.name }}.tar.gz

      - if: inputs.release-tag != ''
        name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: gh release upload "$TAG" eboard-examples-${{ matrix.name }}.tar.gz --clobber
