[package]
name = "eboard"
version = "0.2.1"
edition = "2024"
description = "eframe for embedded boards: run egui apps full-screen on Linux without a compositor (KMS/DRM, framebuffer), like Qt's eglfs and linuxfb"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mounten/eboard"
documentation = "https://docs.rs/eboard"
readme = "README.md"
include = ["/src", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
keywords = ["egui", "embedded", "kms", "framebuffer", "touchscreen"]
categories = ["gui", "embedded"]

[package.metadata.docs.rs]
# eboard drives Linux display and input devices; the other platforms only build stubs.
targets = ["x86_64-unknown-linux-gnu"]
features = ["persistence"]

[features]
default = ["kms", "viv-fb", "linuxfb", "input-evdev", "osk", "default_fonts"]

## Bundle egui's default fonts (`egui/default_fonts`, about 1 MB). Turn it off if the app installs
## its own fonts with `egui::Context::set_fonts`; without any fonts egui draws boxes for text.
default_fonts = ["egui/default_fonts"]

## OpenGL ES 2.0/3.x renderer (egui_glow).
glow = ["dep:egui_glow"]

## CPU renderer (no GPU needed).
soft = []

## DRM/KMS + GBM + EGL display backend (Mesa, NVIDIA Jetson NVGBM, i.MX8 Vivante/etnaviv, ...).
## libgbm is loaded at runtime: without it, `Backend::Auto` falls through to the next backend.
kms = ["glow", "dep:drm", "dep:khronos-egl", "dep:libloading"]

## Vivante GPU on the Linux framebuffer through NXP's fbdev EGL (`fbGetDisplayByIndex`), like Qt's
## eglfs_viv. For i.MX6 BSPs with the Vivante driver but without KMS/GBM. Links no native libraries.
viv-fb = ["glow", "dep:khronos-egl", "dep:libloading"]

## Linux framebuffer (/dev/fbN) backend with the CPU renderer, like Qt's linuxfb. Needs no GPU
## driver and links no native libraries, e.g. for i.MX6 BSPs without KMS/GBM.
linuxfb = ["soft"]

## Touch, mouse and keyboard from /dev/input/event* (pure Rust, no libinput needed).
input-evdev = ["dep:evdev"]

## On-screen keyboard for touch-only devices: shown while a text field has the focus (and, by
## default, no hardware keyboard is attached).
osk = ["input-evdev"]

## Save app state and egui memory between runs (`App::save`, `Storage`), like eframe's
## `persistence`. Written atomically to a RON file, only when it changed.
persistence = ["dep:serde", "dep:ron", "egui/persistence"]

[dependencies]
egui = { version = "0.37", default-features = false }
egui_glow = { version = "0.37", default-features = false, optional = true }
log = "0.4"
ron = { version = "0.12", optional = true }
serde = { version = "1", optional = true }
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
drm = { version = "0.14", optional = true }
khronos-egl = { version = "6.0", default-features = false, features = ["1_5", "dynamic"], optional = true }
libloading = { version = "0.8", optional = true }
evdev = { version = "0.13", optional = true }
libc = "0.2"
rustix = { version = "1", features = ["event", "fs", "time"] }

[dev-dependencies]
env_logger = "0.11"
# Image loaders for `hello` (Ferris). egui_extras turns off `image`'s default features, so the PNG
# decoder has to be enabled here.
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "hello"
# Without fonts every label would be drawn as boxes.
required-features = ["default_fonts"]

[[example]]
name = "hud"
# Text on the HUD plates needs fonts.
required-features = ["default_fonts"]

[[example]]
name = "particles"
required-features = ["default_fonts"]

[[example]]
name = "stress_test"
required-features = ["default_fonts"]
