# Cross-compiling with cross-rs (https://github.com/cross-rs/cross):
#
#   cross build --release --target aarch64-unknown-linux-gnu --example hello      # Pi 5, Jetson, i.MX8
#   cross build --release --target armv7-unknown-linux-gnueabihf --example hello  # i.MX6, 32-bit Pi OS
#   cross build --release --target x86_64-unknown-linux-gnu --example hello       # Intel/AMD boards
#
# Nothing native is linked at build time: libgbm, libEGL and libGLESv2 are loaded with dlopen at
# runtime, so the board's vendor libraries (Mesa, NVIDIA, Vivante, ...) are used and not needed here.
#
# The image is built from docker/Dockerfile.cross-focal (Ubuntu 20.04, glibc 2.31) so the binaries
# also run on boards with older glibc (JetPack 5, Pi OS Bullseye, older Yocto BSPs).

[target.aarch64-unknown-linux-gnu]
dockerfile = { file = "docker/Dockerfile.cross-focal", build-args = { DEB_ARCH = "arm64", GNU_TRIPLE = "aarch64-linux-gnu" } }

[target.armv7-unknown-linux-gnueabihf]
dockerfile = { file = "docker/Dockerfile.cross-focal", build-args = { DEB_ARCH = "armhf", GNU_TRIPLE = "arm-linux-gnueabihf" } }

[target.x86_64-unknown-linux-gnu]
dockerfile = { file = "docker/Dockerfile.cross-focal", build-args = { DEB_ARCH = "amd64", GNU_TRIPLE = "x86_64-linux-gnu" } }
